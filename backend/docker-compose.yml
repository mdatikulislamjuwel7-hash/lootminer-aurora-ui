version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: lootminer-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: lootminer_db
      MYSQL_USER: lootminer
      MYSQL_PASSWORD: lootminer_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: lootminer-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: mysql://lootminer:lootminer_pass@mysql:3306/lootminer_db
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-minimum-64-characters-long-secret-key}
      JWT_EXPIRES_IN: 7d
      PORT: 5000
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-*}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  uploads:
