services:
  - type: web
    name: lootminer-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lootminer-mysql
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: "*"
    healthCheckPath: /api/health
    buildCommand: npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    autoDeploy: true
    plan: starter

  - type: pserv
    name: lootminer-mysql
    runtime: docker
    image:
      source: docker_hub
      name: mysql
      tag: 8.2
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: lootminer_db
      - key: MYSQL_USER
        value: lootminer
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
